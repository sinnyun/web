<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sinnyun - 个人小站</title>
    
    <!-- 网站图标 -->
    <link rel="icon" type="image/x-icon" href="img/favicon.ico">
    <link rel="shortcut icon" type="image/x-icon" href="img/favicon.ico">
    <link rel="apple-touch-icon" href="img/favicon.ico">
    
    <!-- 样式文件 -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    
    <!-- SEO配置 -->
    <script src="js/seoConfig.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            applySEO('home');
        });
    </script>
    
    <!-- 其他脚本 -->
    <script src="js/audioControl.js"></script>
</head>
<body class="homepage">
    <!-- 自定义鼠标 -->
    <div class="cursor-dot"></div>
    <div class="cursor-circle"></div>
    
    <nav class="navbar">
        <div class="logo">
            <a href="index.html">
                <img src="img/logo_h.svg" alt="PORTFOLIO" class="logo-image">
            </a>
        </div>
        <div class="nav-right">
            <a href="projects.html" class="projects-link">work</a>
            <button class="menu-button" onclick="toggleMenu()" title="打开菜单" aria-label="打开菜单">
                <span class="menu-line"></span>
                <span class="menu-line"></span>
                <span class="menu-line"></span>
            </button>
        </div>
    </nav>

    <div class="slideshow">
        <div class="swipe">
            <ul id="slides-container" class="slides-container">
                <!-- 幻灯片内容将通过JavaScript动态生成 -->
            </ul>

            <!-- 导航按钮 -->
            <button class="slide-arrow prev" data-action="prev" title="上一个" aria-label="上一个">
                <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 18l-6-6 6-6"/>
                </svg>
            </button>
            <button class="slide-arrow next" data-action="next" title="下一个" aria-label="下一个">
                <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 18l6-6-6-6"/>
                </svg>
            </button>

            <!-- 缩略图导航 -->
            <div class="thumbnails-container">
                <div id="thumbnails-wrapper" class="thumbnails-wrapper">
                    <!-- 缩略图将通过JavaScript动态生成 -->
                </div>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script src="js/projectsData.js"></script>
</body>
</html>
