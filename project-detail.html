<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 在head标签中添加 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sinnyun - 项目详情</title>
    
    <!-- 网站图标 -->
    <link rel="icon" type="image/x-icon" href="img/favicon.ico">
    <link rel="shortcut icon" type="image/x-icon" href="img/favicon.ico">
    <link rel="apple-touch-icon" href="img/favicon.ico">
    
    <!-- 样式文件 -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/work-detail.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    
    <!-- SEO配置 -->
    <script src="js/seoConfig.js"></script>
    <script src="js/projectsData.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 从URL获取项目ID
            const urlParams = new URLSearchParams(window.location.search);
            const projectId = parseInt(urlParams.get('id'));
            
            // 获取项目数据
            const project = projects.find(p => p.id === projectId);
            
            if (project) {
                // 使用项目数据更新SEO
                applySEO('projectDetail', {
                    title: project.title,
                    description: project.description || project.summary,
                    keywords: project.tags ? project.tags.join(',') : ''
                });
                
                // 更新页面内容
                document.querySelector('.work-banner-left h1').textContent = project.title;
                if (project.description) {
                    document.querySelector('.work-meta-description').textContent = project.description;
                }
            } else {
                // 如果找不到项目，使用默认SEO配置
                applySEO('projectDetail', {
                    title: '未找到项目',
                    description: '抱歉，未找到您请求的项目。',
                    keywords: 'sinnyun,作品'
                });
            }
        });
    </script>
    
    <!-- 其他脚本 -->
    <script src="js/audioControl.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <a href="index.html">
                <img src="img/logo_h.svg" alt="PORTFOLIO" class="logo-image">
            </a>
        </div>
        <div class="nav-right">
            <a href="projects.html" class="projects-link">work</a>
            <button class="menu-button" onclick="toggleMenu()">
                <span class="menu-line"></span>
                <span class="menu-line"></span>
                <span class="menu-line"></span>
            </button>
        </div>
    </nav>

    <!-- 项目横幅 -->
    <div class="work-banner">
        <div class="work-banner-image" id="project-banner-image"></div>
        <div class="work-banner-overlay"></div>
        <div class="work-banner-content">
            
           
            <div class="work-banner-left">
                <div class="work-category">/ THE WEBSITE</div>
                <h1 id="project-title"></h1>
          
           
        </div>
        <div class="work-banner-right">
        <div class="work-meta">
            <div class="work-meta-item" id="project-tags"></div>
            <div class="work-meta-item">
                <span class="meta-label">完成时间</span>
                <span id="project-year"></span>
            </div>
            <div class="work-meta-item">
                <span class="meta-label">项目角色</span>
                <span id="project-role"></span>
            </div>
            <div class="work-meta-description">
            <p id="project-description" class="description-text"></p>
        </div>
            <div class="scroll-down">scroll down</div>
    </div>
    </div>
    </div>
    </div>

    <!-- 项目详情内容 -->
    <div class="work-content">
        <div class="work-features">
            <div class="features-section">
                <h2>项目特点</h2>
                <ul id="project-features"></ul>
            </div>
            <div class="services-section">
                <h2>服务内容</h2>
                <ul id="project-services"></ul>
            </div>
        </div>

        <div class="work-images">
            <div class="work-images-main" id="work-images-main"></div>
            <div class="work-images-grid" id="work-images-grid"></div>
        </div>

        <div class="work-navigation">
            <div id="prev-project" class="work-nav-item nav-link">
                <div class="nav-background"></div>
                <div class="nav-overlay"></div>
                <div class="nav-content">
                    <span class="nav-label">上一个项目</span>
                   
                    <h3 class="nav-title"></h3>
                    <div class="nav-tags" id="prev-tags"></div>
                </div>
            </div>
            <div id="next-project" class="work-nav-item nav-link">
                <div class="nav-background"></div>
                <div class="nav-overlay"></div>
                <div class="nav-content">
                    <span class="nav-label">下一个项目</span>
                    
                    <h3 class="nav-title"></h3>
                    <div class="nav-tags" id="next-tags"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 自定义鼠标 -->
    <div class="custom-cursor"></div>
    <div class="custom-cursor-dot"></div>

    <script src="js/projectsData.js"></script>
    <script>
        function getProjectById(id) {
            return projects.find(p => p.id === id);
        }

        function getProjectIndex(id) {
            return projects.findIndex(p => p.id === id);
        }

        // 获取URL中的项目ID
        const urlParams = new URLSearchParams(window.location.search);
        const projectId = parseInt(urlParams.get('id'));

        // 获取项目数据
        const project = getProjectById(projectId);

        if (project) {
            // 更新页面标题和描述
            document.getElementById('project-title').innerHTML = project.title.replace(/\n/g, '<br>');
            document.getElementById('project-description').textContent = project.description;
            document.querySelector('.work-category').textContent = `/ ${project.category}`;
            
            // 更新项目元数据
            document.getElementById('project-year').textContent = project.year;
            document.getElementById('project-role').textContent = project.role;

            // 更新标签
            const tags = document.getElementById('project-tags');
            tags.innerHTML = '';
            project.tags.forEach((tag, index) => {
                const tagSpan = document.createElement('span');
                tagSpan.className = 'tag';
                tagSpan.textContent = tag;
                tags.appendChild(tagSpan);
            });

            // 更新项目特点
            const featuresList = document.getElementById('project-features');
            featuresList.innerHTML = '';
            project.features.forEach(feature => {
                const li = document.createElement('li');
                li.textContent = feature;
                featuresList.appendChild(li);
            });

            // 更新服务内容
            const servicesList = document.getElementById('project-services');
            servicesList.innerHTML = '';
            project.services.forEach(service => {
                const li = document.createElement('li');
                li.textContent = service;
                servicesList.appendChild(li);
            });

            // 异步加载图片
            async function loadProjectImages() {
                try {
                    // 设置背景图片
                    const bannerImage = document.getElementById('project-banner-image');
                    bannerImage.style.backgroundImage = `url('${project.backgroundImage}')`;

                    // 获取图片容器
                    const imagesContainer = document.querySelector('.work-images');
                    imagesContainer.innerHTML = ''; // 清空容器

                    // 加载详细图片
                    const detailImages = await project.detailImages;
                    if (detailImages && detailImages.length > 0) {
                        // 创建图片分组容器
                        let currentGroup = null;
                        let currentLayout = null;
                        
                        detailImages.forEach((image, index) => {
                            // 如果布局变化或第一张图片，创建新分组
                            if (image.layout !== currentLayout || index === 0) {
                                currentLayout = image.layout;
                                currentGroup = document.createElement('div');
                                currentGroup.className = `image-group layout-${currentLayout}`;
                                imagesContainer.appendChild(currentGroup);
                            }

                            const imageDiv = document.createElement('div');
                            imageDiv.className = `work-image layout-${currentLayout}`;
                            
                            // 替换为懒加载实现
                            const img = document.createElement('img');
                            img.dataset.src = image.path; // 使用data-src代替src
                            img.loading = "lazy"; // 添加原生懒加载支持
                            img.src = image.path;
                            img.alt = project.title;
                            
                            img.onerror = () => {
                                imageDiv.style.display = 'none';
                            };
                            
                            imageDiv.appendChild(img);
                            currentGroup.appendChild(imageDiv);
                        });
                    }

                    // 加载小图网格
                    const miniImages = await project.miniImages;
                    if (miniImages && miniImages.length > 0) {
                        miniImages.forEach(imagePath => {
                            const img = document.createElement('img');
                            img.src = imagePath;
                            img.alt = project.title;
                            
                            // 添加图片加载错误处理
                            img.onerror = () => {
                                img.style.display = 'none';
                            };
                            
                            gridImagesContainer.appendChild(img);
                        });

                        // 根据图片数量调整网格布局
                        const columnCount = miniImages.length <= 3 ? miniImages.length : 3;
                        gridImagesContainer.style.gridTemplateColumns = `repeat(${columnCount}, 1fr)`;
                    }
                } catch (error) {
                    console.error('Error loading images:', error);
                }
            }

            // 开始加载图片
            loadProjectImages();

            // 更新导航
            const currentIndex = getProjectIndex(projectId);
            const prevProject = projects[currentIndex - 1];
            const nextProject = projects[currentIndex + 1];

            const prevContainer = document.getElementById('prev-project');
            const nextContainer = document.getElementById('next-project');
            const navigation = document.querySelector('.work-navigation');

            if (prevProject) {
                prevContainer.querySelector('.nav-title').innerHTML = prevProject.title.replace(/\n/g, '<br>');
                prevContainer.querySelector('.nav-background').style.backgroundImage = `url('${prevProject.backgroundImage}')`;
                
                // 更新上一页的标签
                const prevTags = prevContainer.querySelector('.nav-tags');
                prevTags.innerHTML = '';
                const prevMetaItem = document.createElement('div');
                prevMetaItem.className = 'work-meta-item';
                prevProject.tags.forEach(tag => {
                    const span = document.createElement('span');
                    span.className = 'tag';
                    span.textContent = tag;
                    prevMetaItem.appendChild(span);
                });
                prevTags.appendChild(prevMetaItem);
                
                prevContainer.onclick = () => {
                    window.location.href = `project-detail.html?id=${prevProject.id}`;
                };
            }

            if (nextProject) {
                nextContainer.querySelector('.nav-title').innerHTML = nextProject.title.replace(/\n/g, '<br>');
                nextContainer.querySelector('.nav-background').style.backgroundImage = `url('${nextProject.backgroundImage}')`;
                
                // 更新下一页的标签
                const nextTags = nextContainer.querySelector('.nav-tags');
                nextTags.innerHTML = '';
                const nextMetaItem = document.createElement('div');
                nextMetaItem.className = 'work-meta-item';
                nextProject.tags.forEach(tag => {
                    const span = document.createElement('span');
                    span.className = 'tag';
                    span.textContent = tag;
                    nextMetaItem.appendChild(span);
                });
                nextTags.appendChild(nextMetaItem);
                
                nextContainer.onclick = () => {
                    window.location.href = `project-detail.html?id=${nextProject.id}`;
                };
            }

            // 处理导航的显示/隐藏
            if (!prevProject && nextProject) {
                prevContainer.classList.add('hidden');
                navigation.classList.add('single-nav');
            } else if (!nextProject && prevProject) {
                nextContainer.classList.add('hidden');
                navigation.classList.add('single-nav');
            } else if (prevProject && nextProject) {
                navigation.classList.remove('single-nav');
            }
        }
    </script>
    <script src="js/main.js"></script>
</body>
</html>
